name: Build Production Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: production_release

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, dom, filter, gd, json, pdo, pdo_mysql, pdo_sqlite, sqlite3
          tools: composer:v2

      - name: Install production Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev --optimize-autoloader --classmap-authoritative

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Prepare production zip
        run: |
          RELEASE_DIR="release/travidofx"
          ZIP_NAME="tradivofx-production-${GITHUB_RUN_ID}.zip"

          rm -rf release "$ZIP_NAME"
          mkdir -p "$RELEASE_DIR"

          rsync -a ./ "$RELEASE_DIR/" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".claude" \
            --exclude=".codex" \
            --exclude=".cursor" \
            --exclude=".fleet" \
            --exclude=".idea" \
            --exclude=".nova" \
            --exclude=".vscode" \
            --exclude=".zed" \
            --exclude="node_modules" \
            --exclude="release" \
            --exclude="tests" \
            --exclude="storage/logs/*" \
            --exclude="storage/framework/cache/data/*" \
            --exclude="storage/framework/sessions/*" \
            --exclude="storage/framework/testing/*" \
            --exclude="storage/framework/views/*" \
            --exclude="Archive.zip" \
            --exclude="*.zip"

          find "$RELEASE_DIR" -name ".env*" -type f -delete
          find "$RELEASE_DIR" -name ".phpunit.result.cache" -type f -delete
          find "$RELEASE_DIR" -name ".DS_Store" -type f -delete

          cd "$RELEASE_DIR"
          zip -qr "../../$ZIP_NAME" .

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-release
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: production-${{ github.run_id }}
          name: Production Build ${{ github.run_number }}
          files: ${{ env.ZIP_NAME }}
          make_latest: true
